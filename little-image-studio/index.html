<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f1e9">
<title>Little Image Studio · GitHub Garage</title>
<style>
:root{color-scheme:light;--paper:#f2f1e9;--ink:#20251d;--muted:#687064;--line:#d9dbcf;--green:#a8d84d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
.brand{font-weight:750;letter-spacing:-.03em}.brand span{color:#6f9635}.back{color:var(--muted);text-decoration:none;font-size:12px}.back:hover{color:var(--ink)}
main{max-width:1240px;margin:auto;padding:18px 18px 24px}.intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:4px 0 14px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#6f9635;font-weight:800}.intro h1{font-size:clamp(24px,4vw,38px);letter-spacing:-.06em;line-height:1.05;margin:5px 0}.intro p{color:var(--muted);margin:0;font-size:12px}.open{white-space:nowrap;background:var(--ink);color:#f7f8ef;text-decoration:none;padding:10px 14px;border-radius:7px;font-size:12px;font-weight:650}.frame{height:calc(100vh - 150px);min-height:560px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white;box-shadow:0 12px 40px #20251d0c}.frame iframe{width:100%;height:100%;border:0;background:white}
@media(max-width:600px){header{padding:0 14px}.intro{align-items:start;flex-direction:column}.frame{height:calc(100vh - 205px);min-height:500px;border-radius:8px}main{padding:14px}}
</style>
</head>
<body>
<header><div class="brand">GITHUB GARAGE <span>/ LITTLE IMAGE STUDIO</span></div><a class="back" href="../">← Back to Garage</a></header>
<main>
<section class="intro"><div><div class="eyebrow">Creative workbench · Live</div><h1>Little Image Studio</h1><p>Make a picture. Keep the good ones. Export a crisp square PNG.</p></div><a class="open" href="https://dim-secret-afkgaming.replit.app" target="_blank" rel="noopener">Open full app ↗</a></section>
<div class="frame"><iframe src="https://dim-secret-afkgaming.replit.app" title="Little Image Studio" allow="clipboard-read; clipboard-write" loading="eager"></iframe></div>
</main>
</body>
</html>
