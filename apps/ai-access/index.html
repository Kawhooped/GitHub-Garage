<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014">
<title>AI Access — VOID</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--line:#303039;--text:#f3f1f7;--muted:#a6a2b0;--accent:#c5a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{width:min(680px,100% - 32px);margin:56px auto}
header{margin-bottom:28px}small{color:var(--accent);letter-spacing:.14em;font-weight:700}h1{font-size:2rem;margin:8px 0}p{color:var(--muted);margin:0}
section{display:grid;gap:10px;margin-top:20px}
a{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none}
a:hover{border-color:var(--accent)}a span:last-child{color:var(--muted)}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
<header><small>VOID / DIRECTORY</small><h1>AI Access</h1><p>AI services, one simple page.</p></header>
<section aria-label="AI services">
<a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer"><span>ChatGPT</span><span>↗</span></a>
<a href="https://claude.ai/" target="_blank" rel="noopener noreferrer"><span>Claude</span><span>↗</span></a>
<a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer"><span>Gemini</span><span>↗</span></a>
<a href="https://www.perplexity.ai/" target="_blank" rel="noopener noreferrer"><span>Perplexity</span><span>↗</span></a>
<a href="https://huggingface.co/chat/" target="_blank" rel="noopener noreferrer"><span>HuggingChat</span><span>↗</span></a>
<a href="https://openrouter.ai/" target="_blank" rel="noopener noreferrer"><span>OpenRouter</span><span>↗</span></a>
</section>
<footer>No account system. No database. No tracking. Just links.</footer>
</main>
</body>
</html>
